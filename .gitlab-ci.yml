stages:
  - before_build
  - deploy

include:
  - project: "sanger-pathogens/templates/ci-templates"
    ref: "PAT-2100/CI_templates_for_pipeline_deployment_on_farm"
    file: "before-build-template.yml"
  - project: "sanger-pathogens/templates/ci-templates"
    ref: "PAT-2100/CI_templates_for_pipeline_deployment_on_farm"
    file: "farm22/farm-deploy.yml"

eslint:
  rules:
    - when: never

talisman:
  variables:
    TALISMAN_OPTS: "--scan --ignoreHistory"

.deploy_to_farm:
  variables:
    FARM_NAME: "strain-mapper"
    FARM_FILE_CHMOD: "[strain-mapper.sh]='+x' [main.nf]='+x'"
    FARM_FILE_RENAME: "[strain-mapper.sh]='strain-mapper'"

deploy_to_farm_ALL_TAGS:
  extends:
    - .deploy_to_farm
    - .rules_for_tags
  variables:
    # TODO path below is a temporary test deployment directory
    FARM_PATH: "${FARM_APP_ROOT}/applications/farm-etc-testing/PAT-2100_testing_installs"
